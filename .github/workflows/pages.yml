name: Deploy website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare published site
        run: |
          mkdir -p _site
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/liquid-preview/' --exclude='/_site/' ./ _site/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check protected photo assets
        run: node liquid-preview/scripts/check-photo-privacy.mjs --published _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
