{{- partial "helper/external" (dict "Context" . "Namespace" "KaTeX") -}}
<style>
    .main-article .katex-display {
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 0.35em;
    }
    .main-article .katex-display::-webkit-scrollbar {
        height: 6px;
    }
    .main-article .katex-display::-webkit-scrollbar-thumb {
        background: var(--card-separator-color, #ccc);
        border-radius: 3px;
    }
</style>
<script>
    window.addEventListener("DOMContentLoaded", () => {
        const elementsToRender = [".main-article", ".widget--toc"];

        elementsToRender.forEach(selector => {
            const element = document.querySelector(selector);
            if (element) {
                renderMathInElement(element, {
                    delimiters: [
                        { left: "$$", right: "$$", display: true },
                        { left: "$", right: "$", display: false },
                        { left: "\\(", right: "\\)", display: false },
                        { left: "\\[", right: "\\]", display: true }
                    ],
                    ignoredClasses: ["gist"],
                    throwOnError: false,
                    strict: false
                });
            }
        });
    });
</script>
