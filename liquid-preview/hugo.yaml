baseURL: "https://xiaoojs20.github.io/"
canonifyURLs: true
title: xiaoojs20
theme: hugo-theme-stack
copyright: "xiaoojs20"
defaultContentLanguage: en
hasCJKLanguage: true
mediaTypes:
  application/yaml:
    suffixes: [yml]
outputFormats:
  CMSConfig:
    mediaType: application/yaml
    baseName: config
    isPlainText: true
    notAlternative: true
  sitemapflat:
    mediaType: application/xml
    baseName: sitemap-flat
    isPlainText: true
    notAlternative: true
languages:
  en:
    label: English
    locale: en-US
    weight: 1
    params:
      sidebar:
        subtitle: Collecting little moments from everyday life.
  zh:
    label: 简体中文
    locale: zh-Hans
    weight: 2
    copyright: "xiaoojs20"
    params:
      sidebar:
        subtitle: 记录生活，收藏日常里的点滴。
pagination: { pagerSize: 10 }
permalinks:
  post: /p/:slug/
  page: /:slug/
params:
  analytics:
    cloudflare:
      # Public collection token, not an API credential. Reports require your Cloudflare login.
      token: "907f48a30a8447df95b02845f4c004ae"
  showLife: false # 隐藏生活记录入口；改为 true 可恢复。
  showPhotos: false # 隐藏照片墙入口；改为 true 可恢复。
  version: "1.2.0"
  contact:
    email: "xiaoojs20@gmail.com"
    x: "https://x.com/redefine1020"
    instagram: "https://www.instagram.com/xiaoo1020/"
    youtube: "https://www.youtube.com/@xiaoojs20"
  coffeeChat:
    bookingURL: "https://calendar.app.google/vDyM9zvxDdA1AYRU6"
    embedURL: "https://calendar.google.com/calendar/appointments/schedules/AcZssZ0oz7D_K7Fk1USKkNeNeN410EK2J4wbsTtGONWPe-HYLCqig3z404IOzmSCDTxlcg-ojN9me6G2"
  mainSections: [post]
  favicon: /img/liquid-stack/logo-transparent.png
  dateFormat:
    published: 02/Jan/2006
    lastUpdated: 02/Jan/2006 15:04 MST
  sidebar:
    emoji: "😄"
    subtitle: Collecting little moments from everyday life.
    avatar: /img/avatar-personal.jpg
  footer:
    since: 2026
    customText: Built with Liquid Stack.
    demoSiteViews: 2673
    demoRuntimeDays: 365
  article:
    math: true
    toc: true
    readingTime: true
    license: { enabled: true, default: Licensed under CC BY-SA 4.0 }
  comments:
    enabled: false
    provider: waline
    waline:
      serverURL: https://example.com/waline
      demoMode: false
      secureUploads:
        enabled: false
        turnstileSiteKey: ""
        uploadEndpoint: ""
        uploadSessionEndpoint: ""
        commentEndpoint: ""
        commentContextEndpoint: ""
      reaction:
        - "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
        - "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
        - "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
        - "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
        - "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
  widgets:
    homepage:
      - { type: search }
      - { type: world-clock }
      - type: archives
        params: { limit: 5 }
      - type: categories
        params: { limit: 10 }
      - type: tag-cloud
        params: { limit: 10 }
    page: [{ type: toc }]
  defaultImage:
    opengraph: { enabled: true, local: true, src: /img/liquid-stack/featured.png }
  colorScheme: { toggle: true, default: auto }
  imageProcessing:
    thumbnail: { enabled: true }
    content: { enabled: true }
menu:
  social:
    - { identifier: github, name: GitHub, url: https://github.com/xiaoojs20, weight: 1, params: { icon: brand-github, newTab: true } }
    - { identifier: x, name: X, url: https://x.com/redefine1020, weight: 2, params: { icon: brand-x, newTab: true } }
    - { identifier: youtube, name: YouTube, url: https://www.youtube.com/@xiaoojs20, weight: 3, params: { icon: social-youtube, newTab: true } }
    - { identifier: instagram, name: Instagram, url: https://www.instagram.com/xiaoo1020/, weight: 4, params: { icon: social-instagram, newTab: true } }
related:
  includeNewer: true
  threshold: 60
  indices: [{ name: tags, weight: 100 }, { name: categories, weight: 200 }]
markup:
  goldmark:
    renderer: { unsafe: true }
  tableOfContents: { endLevel: 4, ordered: true, startLevel: 2 }
  highlight: { noClasses: false, lineNos: true }
outputs:
  home: [HTML, sitemapflat]

# 备用照片留在城市子目录中，但不复制到公开网站。
module:
  mounts:
    - { source: archetypes, target: archetypes }
    - { source: assets, target: assets }
    - { source: content, target: content }
    - { source: data, target: data }
    - { source: layouts, target: layouts }
    - { source: i18n, target: i18n }
    - source: static
      target: static
      files: ["! img/travel/**/备用/**"]
