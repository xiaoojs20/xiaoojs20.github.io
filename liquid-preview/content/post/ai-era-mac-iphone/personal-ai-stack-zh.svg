<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-label="个人 AI 系统中的数据获取、模型推理与任务执行"><style>
  :root{--fg:#292d33;--muted:#767c86;--line:#e6e8ed;--accent:#30669b;--soft:#f4f7fa;--paper:#fff}
  text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:var(--fg)}
  .node{fill:var(--soft);stroke:var(--line);stroke-width:1.5}
  .special{fill:var(--soft);stroke:var(--accent);stroke-width:1.5}
  .arrow{stroke:var(--muted);fill:none;stroke-width:1.5}
  .dim{fill:var(--muted)}
  @media (prefers-color-scheme:dark){
    :root{--fg:#e2e4e8;--muted:#a0a5af;--line:#3b3e45;--accent:#8fb8e4;--soft:#2d333b;--paper:#24262b}
  }
